name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (PSScriptAnalyzer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Analyse PowerShell sources
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path ./src -Recurse -Settings ./.github/PSScriptAnalyzerSettings.psd1
          $issues | Format-Table -AutoSize | Out-String | Write-Host
          if ($issues.Count -gt 0) {
            Write-Error "PSScriptAnalyzer found $($issues.Count) issue(s)."
            exit 1
          }
          Write-Host 'No PSScriptAnalyzer issues.'

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Static catalog + encoding tests
        shell: pwsh
        run: ./tests/Test-Catalog.ps1

      # The engine drives Windows-specific APIs (Get-Service, Get-ScheduledTask,
      # Get-AppxPackage), so its behavioural suite only runs on Windows.
      - name: Engine behaviour tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/Test-Engine.ps1

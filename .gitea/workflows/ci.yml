# Gitea Actions mirror of the GitHub workflow.
# Gitea enables Actions with `ENABLED = true` in app.ini and reuses GitHub
# workflow syntax, so this file is intentionally a near-copy of ci.yml.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (PSScriptAnalyzer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run the lint gate that contributors run locally
        shell: pwsh
        run: ./tests/Test-Analyzer.ps1

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Static catalog + encoding tests
        shell: pwsh
        run: ./tests/Test-Catalog.ps1

      # The engine drives Windows-specific APIs (Get-Service, Get-ScheduledTask,
      # Get-AppxPackage), so its behavioural suite only runs on Windows.
      - name: Engine behaviour tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/Test-Engine.ps1

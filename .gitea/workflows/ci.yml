# Gitea Actions mirror of the GitHub workflow.
# Gitea enables Actions with `ENABLED = true` in app.ini and reuses GitHub
# workflow syntax, so this file is intentionally a near-copy of ci.yml.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (PSScriptAnalyzer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run the lint gate that contributors run locally
        shell: pwsh
        run: ./tests/Test-Analyzer.ps1

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Syntax gate (parser)
        shell: pwsh
        run: ./tests/Test-Parse.ps1

      - name: Documentation gate (links, bilingual pairs, no private addresses)
        shell: pwsh
        run: ./tests/Test-Docs.ps1

      - name: Generated catalog is current
        shell: pwsh
        run: ./tools/New-CatalogDoc.ps1 -Check

      - name: Static catalog + encoding tests
        shell: pwsh
        run: ./tests/Test-Catalog.ps1

      # The engine drives Windows-specific APIs (Get-Service, Get-ScheduledTask,
      # Get-AppxPackage), so its behavioural suite only runs on Windows.
      - name: Engine behaviour tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/Test-Engine.ps1

      # The TUI's logic and rendering are pure functions, so they are testable in
      # CI. The keyboard loop is not, and is verified by hand.
      - name: TUI logic tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/Test-Tui.ps1

      - name: TUI rendering tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/Test-TuiRender.ps1

      - name: Release package contents
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/Test-Release.ps1

      - name: Windowed frontend tests
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/Test-Gui.ps1
